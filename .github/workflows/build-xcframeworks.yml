name: Build XCFrameworks

on:
  workflow_call:
    inputs:
      build_libs:
        description: 'Libraries to build: all, openssl, cssh, vnc, llama, openssl+cssh, openssl+vnc'
        default: 'all'
        type: string
  workflow_dispatch:
    inputs:
      build_libs:
        description: 'Libraries to build: all, openssl, cssh, vnc, llama, openssl+cssh, openssl+vnc'
        default: 'all'
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: brew install cmake ninja libtool autoconf automake nasm

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ================================================================
      # OpenSSL — 版本标签始终计算，缓存始终恢复（CSSH/VNC 依赖产物）
      # ================================================================
      - name: Get OpenSSL version tag
        run: |
          VERSION=$(grep -E '^OPENSSL_VERSION=' OpenSSL/build_xcframework.sh | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "OPENSSL_VERSION_TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "OpenSSL version: ${VERSION}"

      - name: Restore OpenSSL cache
        id: openssl-cache
        uses: actions/cache@v6
        with:
          path: OpenSSL/openssl_xcframework_build/
          key: openssl-${{ env.OPENSSL_VERSION_TAG }}-macos15

      - name: Cache OpenSSL sources
        uses: actions/cache@v6
        with:
          path: OpenSSL/openssl_xcframework_build/sources/
          key: openssl-sources-${{ env.OPENSSL_VERSION_TAG }}

      - name: Build OpenSSL
        if: (inputs.build_libs == 'all' || contains(inputs.build_libs, 'openssl')) && steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf OpenSSL/openssl_xcframework_build/build OpenSSL/openssl_xcframework_build/xcframework OpenSSL/xcframework
          mkdir -p OpenSSL/openssl_xcframework_build
          cd OpenSSL && bash build_xcframework.sh

      - name: Report OpenSSL sizes
        if: always()
        run: |
          echo "=== OpenSSL xcframework ==="
          ls -lh OpenSSL/xcframework/OpenSSL.xcframework/ 2>/dev/null || echo "Not found"
          for d in OpenSSL/openssl_xcframework_build/build/install_*/; do
            [ -d "$d" ] && echo "$d: $(du -sh "$d" | cut -f1)"
          done

      # ================================================================
      # CSSH (libssh)
      # ================================================================
      - name: Cache CSSH sources
        if: inputs.build_libs == 'all' || contains(inputs.build_libs, 'cssh')
        uses: actions/cache@v6
        with:
          path: CSSH/xcframework_build/sources/
          key: cssh-sources-${{ hashFiles('CSSH/build_xcframework.sh') }}

      - name: Build CSSH (libssh)
        if: inputs.build_libs == 'all' || contains(inputs.build_libs, 'cssh')
        working-directory: ./CSSH
        env:
          OPENSSL_BUILD_DIR: ${{ github.workspace }}/OpenSSL/openssl_xcframework_build
        run: |
          echo "OPENSSL_BUILD_DIR=${OPENSSL_BUILD_DIR}"
          ls -la "${OPENSSL_BUILD_DIR}/build/" || echo "OpenSSL build dir not found!"
          bash build_xcframework.sh

      # ================================================================
      # VNC (libvncserver)
      # ================================================================
      - name: Cache VNC sources
        if: inputs.build_libs == 'all' || contains(inputs.build_libs, 'vnc')
        uses: actions/cache@v6
        with:
          path: |
            VNC/xcframework_build/sources/
            VNC/xcframework_build/deps/
          key: vnc-sources-${{ hashFiles('VNC/build_xcframework.sh') }}

      - name: Build VNC (libvncserver)
        if: inputs.build_libs == 'all' || contains(inputs.build_libs, 'vnc')
        working-directory: ./VNC
        env:
          OPENSSL_BUILD_DIR: ${{ github.workspace }}/OpenSSL/openssl_xcframework_build
        run: |
          echo "OPENSSL_BUILD_DIR=${OPENSSL_BUILD_DIR}"
          bash build_xcframework.sh

      # ================================================================
      # Llama (llama.cpp) — 独立构建，不依赖 OpenSSL
      # ================================================================
      - name: Get Llama version tag
        run: |
          VERSION=$(grep -E '^LLAMA_VERSION=' Llama/build_xcframework.sh | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "LLAMA_VERSION_TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "Llama version: ${VERSION}"

      - name: Restore Llama cache
        id: llama-cache
        uses: actions/cache@v6
        with:
          path: Llama/llama_xcframework_build/
          key: llama-${{ env.LLAMA_VERSION_TAG }}-macos15

      - name: Cache Llama sources
        uses: actions/cache@v6
        with:
          path: Llama/llama_xcframework_build/sources/
          key: llama-sources-${{ env.LLAMA_VERSION_TAG }}

      - name: Build Llama (llama.cpp)
        if: (inputs.build_libs == 'all' || contains(inputs.build_libs, 'llama')) && steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf Llama/llama_xcframework_build/build Llama/llama_xcframework_build/xcframework Llama/xcframework
          mkdir -p Llama/llama_xcframework_build
          cd Llama && bash build_xcframework.sh

      - name: Report Llama sizes
        if: always()
        run: |
          echo "=== Llama xcframework ==="
          ls -lh Llama/xcframework/llama.xcframework/ 2>/dev/null || echo "Not found"
          for d in Llama/llama_xcframework_build/build/llama_*/; do
            [ -d "$d" ] && echo "$d: $(du -sh "$d" | cut -f1)"
          done

      # ================================================================
      # Push to target repos
      # ================================================================
      - name: Collect xcframeworks
        if: success()
        run: |
          mkdir -p xcframeworks
          [ -d "OpenSSL/xcframework/OpenSSL.xcframework" ] && \
            cp -R OpenSSL/xcframework/OpenSSL.xcframework xcframeworks/
          [ -d "CSSH/xcframework/libssh.xcframework" ] && \
            cp -R CSSH/xcframework/libssh.xcframework xcframeworks/
          [ -d "VNC/xcframework/libvncclient.xcframework" ] && \
            cp -R VNC/xcframework/libvncclient.xcframework xcframeworks/
          [ -d "Llama/xcframework/llama.xcframework" ] && \
            cp -R Llama/xcframework/llama.xcframework xcframeworks/
          echo "=== Built xcframeworks ==="
          ls -la xcframeworks/

      - name: Push OpenSSL to foxterm/OpenSSL
        if: success() && hashFiles('xcframeworks/OpenSSL.xcframework') != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/foxterm/OpenSSL.git
          cd OpenSSL
          rm -rf OpenSSL.xcframework
          cp -R ${GITHUB_WORKSPACE}/xcframeworks/OpenSSL.xcframework .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenSSL.xcframework
          if ! git diff --cached --quiet; then
            git commit -m "build: update OpenSSL.xcframework (${OPENSSL_VERSION_TAG})"
            git push
            echo "✓ 已推送 OpenSSL.xcframework 到 foxterm/OpenSSL"
          else
            echo "→ OpenSSL 无变更，跳过"
          fi

      - name: Push libssh to foxterm/SSH
        if: success() && hashFiles('xcframeworks/libssh.xcframework') != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          LIBSSH_VERSION=$(grep -E '^LIBSSH_VERSION=' ${GITHUB_WORKSPACE}/CSSH/build_xcframework.sh | head -1 | sed 's/.*"\(.*\)".*/\1/')
          cd /tmp
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/foxterm/SSH.git
          cd SSH
          rm -rf libssh.xcframework
          cp -R ${GITHUB_WORKSPACE}/xcframeworks/libssh.xcframework .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libssh.xcframework
          if ! git diff --cached --quiet; then
            git commit -m "build: update libssh.xcframework (${LIBSSH_VERSION})"
            git push
            echo "✓ 已推送 libssh.xcframework 到 foxterm/SSH"
          else
            echo "→ libssh 无变更，跳过"
          fi

      - name: Push libvncclient to foxterm/VNC
        if: success() && hashFiles('xcframeworks/libvncclient.xcframework') != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/foxterm/VNC.git
          cd VNC
          rm -rf libvncclient.xcframework
          cp -R ${GITHUB_WORKSPACE}/xcframeworks/libvncclient.xcframework .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libvncclient.xcframework
          if ! git diff --cached --quiet; then
            git commit -m "build: update libvncclient.xcframework"
            git push
            echo "✓ 已推送 libvncclient.xcframework 到 foxterm/VNC"
          else
            echo "→ libvncclient 无变更，跳过"
          fi

      - name: Push llama to foxterm/Llama
        if: success() && hashFiles('xcframeworks/llama.xcframework') != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/foxterm/Llama.git
          cd Llama
          rm -rf llama.xcframework
          cp -R ${GITHUB_WORKSPACE}/xcframeworks/llama.xcframework .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llama.xcframework
          if ! git diff --cached --quiet; then
            git commit -m "build: update llama.xcframework (${LLAMA_VERSION_TAG})"
            git push
            echo "✓ 已推送 llama.xcframework 到 foxterm/Llama"
          else
            echo "→ llama 无变更，跳过"
          fi

      # ================================================================
      # Size report
      # ================================================================
      - name: Final size report
        if: always()
        run: |
          echo "=========================================="
          echo "         XCFramework 体积报告"
          echo "=========================================="
          if [ -d "xcframeworks" ]; then
            for xfw in xcframeworks/*.xcframework; do
              [ -d "$xfw" ] || continue
              name=$(basename "$xfw")
              size=$(du -sh "$xfw" 2>/dev/null | cut -f1)
              printf "%-30s %s\n" "$name" "$size"
            done
          fi
          echo "=========================================="
